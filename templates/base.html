
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}{% endblock %}</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fb;
}

.container{
    display:flex;
    height:100vh;
}

/* Sidebar */

.sidebar{
    width:240px;
    background:white;
    border-right:1px solid #e5e5e5;
    padding:20px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    margin-bottom:40px;
}

.nav a{
    display:block;
    padding:12px;
    text-decoration:none;
    color:#333;
    border-radius:8px;
    margin-bottom:10px;
}

.nav a:hover{
    background:#f0f2f7;
}

/* Main */

.main{
    flex:1;
    padding:30px;
}

.form-card{
    background:white;
    border-radius:14px;
    padding:30px;
    border:1px solid #e5e5e5;
    max-width:520px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-size:14px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

.row{
    display:flex;
    gap:15px;
}

.row .form-group{
    flex:1;
}

.primary-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#1f4ed8;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.primary-btn:hover{
    background:#1739b0;
}

.balance-info{
    margin-bottom:20px;
    padding:15px;
    background:#eef2ff;
    border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="sidebar">

<div class="logo">TrustPay</div>

<div class="nav">
<a href="{{url_for('dashboard_page')}}">Dashboard</a>
<a href="{{url_for('send_money')}}">Send Money</a>
<a href="{{url_for('top_up')}}">Top Up</a>
<a href="{{url_for('see_my_card')}}">Card Details</a>
<a href="{{url_for('transactions')}}">Transactions</a>
<a href="#">Settings</a>
</div>

</div>

<div class="main">

{% block content %}
{% endblock %}

</div>

</div>

</body>
</html>
