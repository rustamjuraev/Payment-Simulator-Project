
{% extends "base.html" %}

{% block title %}Top Up Wallet{% endblock %}

{% block content %}

<div class="form-card">

<h2>Top Up Wallet</h2>

<div class="balance-info">
Current Balance: <strong>{{user.wallet.balance}} UZS</strong>
</div>

<form method="POST">

<div class="form-group">
<label>Your Card Number</label>
<input type="text" name="card_number" required>
</div>

<div class="row">

<div class="form-group">
<label>Expiry</label>
<input type="text" name="expiry" required>
</div>

<div class="form-group">
<label>CVV</label>
<input type="text" name="cvv" required>
</div>

</div>

<div class="form-group">
<label>Amount</label>
<input type="number" name="amount" required>
</div>

<button class="primary-btn">Top Up</button>

</form>

</div>

{% endblock %}
