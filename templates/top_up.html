{% extends "base.html" %}

{% block title %}Top Up Wallet{% endblock %}

{% block content %}

<div class="form-card">

<h2>Top Up Wallet</h2>

<div class="balance-info">
Current Balance: <strong>{{ user.wallet.balance }} UZS</strong>
</div>

<form action="{{url_for('top_up')}}" method="POST">

<div class="form-group">
<label>Amount to Add (USD)</label>
<input type="number" name="amount" placeholder="Enter amount" required>
</div>

<button type="submit" class="primary-btn">Proceed to Payment</button>

</form>

</div>

{% endblock %}
