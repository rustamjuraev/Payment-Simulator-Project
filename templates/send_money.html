{% extends "base.html" %}

{% block title %}Send Money{% endblock %}

{% block content %}

<div class="form-card">

<h2 style="margin-bottom:10px;">Send Money</h2>

<div class="balance-info">
Available Balance: <strong>{{user.wallet.balance}} UZS</strong>
</div>

<form action="{{url_for('send_money')}}" method="POST">

<div class="form-group">
<label>Recipient Name</label>
<input type="text" name="recipient_name" placeholder="John Doe" required>
</div>

<div class="form-group">
<label>Recipient Email</label>
<input type="email" name="recipient_email" placeholder="john@example.com" required>
</div>

<div class="form-group">
<label>Amount (UZS)</label>
<input type="number" name="amount" placeholder="Enter amount" required>
</div>

<div class="form-group">
<label>Note (Optional)</label>
<input type="text" name="note" placeholder="Payment for lunch">
</div>

<button type="submit" class="primary-btn">Send Money</button>

</form>

</div>

{% endblock %}
